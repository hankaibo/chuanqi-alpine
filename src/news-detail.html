<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>资讯中心 - 传麒科技</title>
    <base href="%BASE_URL%" />
    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <div x-data="headerData" x-html="headerHtml"></div>

    <main x-data="data" x-init="getDetail()" class="flex flex-col justify-between">
      <div class="bg-[#f6f7f8] container-primary">
        <div class="-mx-4 sm:-mx-8 lg:-mx-16 xl:-mx-32 2xl:-mx-64">
          <img src="./images/news.webp" class="bg-no-repeat bg-[length:100%_auto]" alt="banner" />
        </div>

        <div class="flex flex-col bg-white p-4 sm:p-8 lg:p-16 my-4 lg:my-8">
          <div class="text-xl lg:text-4xl lg:text-center lg:mb-5 xl:text-4xl text-[#333]" x-text="name"></div>
          <div class="flex justify-center gap-4 p-2">
            <span class="text-[#bbb] text-xs lg:text-base inline-flex items-center">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-3 h-3 lg:w-4 lg:h-4"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-clock"
              >
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
              </svg>
              <span class="pl-1">发布时间：</span>
              <span class="pr-2" x-text="publishDate"></span>

              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-eye"
              >
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span class="pl-1">浏览量：</span>
              <span x-text="views"></span>
            </span>
          </div>
          <div class="p-2.5 text-xs text-[#333] bg-[#f6f7f8] lg:mt-8 lg:text-base">
            <span x-text="summary"></span>
          </div>

          <div id="editor-container" class="t-mx-2.5 text-xs lg:text-base text-[#333]" style="min-height: 500px"></div>
        </div>
      </div>
    </main>

    <div x-data="footerData" x-html="footerHtml"></div>

    <script type="module" src="./news-detail.js"></script>
  </body>
</html>
