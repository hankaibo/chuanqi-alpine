<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工程案例 - 传麒科技</title>
    <link rel="icon" href="/favicon.ico" />
    <base href="/temp/" />
    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div x-data="headerData" x-html="headerHtml"></div>

    <main x-data="data" class="flex flex-col justify-between">
      <div class="bg-[#f6f7f8] px-4 sm:px-8 lg:px-16 xl:px-32 2xl:px-64">
        <div class="-mx-4 sm:-mx-8 lg:-mx-16 xl:-mx-32 2xl:-mx-64">
          <img src="./images/case.webp" class="bg-no-repeat bg-[length:100%_auto]" alt="banner" />
        </div>

        <div class="mt-2 sm:mt-4">
          <div x-data="tabsData" class="relative w-full">
            <div x-ref="tabButtons" class="relative">
              <div class="relative flex items-center text-gray-500 bg-white select-none py-2">
                <template x-for="tab in tabs" :key="tab.id">
                  <button
                    :id="$id(tabId)"
                    @click="tabButtonClicked($el, tab);"
                    type="button"
                    :class="{ 'text-primary' : tabButtonActive($el) }"
                    class="text-lg font-semibold px-12 z-20 inline-flex items-center justify-center h-8 transition-all cursor-pointer whitespace-nowrap"
                    x-text="tab.name"
                  ></button>
                </template>
              </div>
              <div class="relative z-10 w-full h-0.5 bg-white" x-cloak>
                <div x-ref="tabMarker" class="absolute w-40 h-full bg-primary duration-300 ease-out"></div>
              </div>
            </div>

            <div class="relative flex items-center justify-center w-full py-5 mt-2 text-xs text-gray-400 content">
              <template x-for="tab in tabs" :key="tab.id">
                <div :id="$id(tabId + '-content')" x-show="tabContentActive($el)" class="relative grid grid-cols-1 gap-4 py-4 lg:grid-cols-2 lg:gap-6 lg:pb-6 xl:grid-cols-3 xl:gap-8 xl:pb-8">
                  <template x-for="tabContent in tabContents[tab.id]" :key="tabContent.id">
                    <div @click="handleDetail(tabContent)" class="hover:-translate-y-5 transition duration-200">
                      <div class="h-60 cursor-pointer">
                        <img class="w-full h-full cursor-pointer object-cover" :src="tabContent.imageUrl" />
                      </div>

                      <div class="flex flex-col justify-between p-3 h-48 bg-white">
                        <h3 class="text-sm text-[#333333] mb-3 cursor-pointer" x-text="tabContent.name"></h3>
                        <div class="text-xs text-[#888] cursor-pointer text-ellipsis line-clamp-4" x-text="tabContent.summary"></div>

                        <span class="text-[#bbb] text-[10px] mt-auto inline-flex items-center">
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="w-2 h-2"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-clock"
                          >
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12 6 12 12 16 14" />
                          </svg>
                          <span class="pl-1">发布时间： <span x-text="tabContent.publishedAt"></span></span>
                        </span>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div x-data="footerData" x-html="footerHtml"></div>

    <script type="module" src="./cases.js"></script>
  </body>
</html>
