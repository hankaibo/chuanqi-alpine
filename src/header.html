<header class="fixed top-0 left-0 right-0 flex justify-center h-18 z-[9999] text-white bg-[rgba(0,0,0,0.6)]">
  <div class="flex items-center">
    <a href="/">
      <img src="/images/login/logo.png" class="w-[100px]" />
    </a>
  </div>

  <nav x-data="{
    navigationMenuOpen: false,
    navigationMenu: '',
    navigationMenuCloseDelay: 200,
    navigationMenuCloseTimeout: null,
    navigationMenuLeave() {
        let that = this;
        this.navigationMenuCloseTimeout = setTimeout(() => {
            that.navigationMenuClose();
        }, this.navigationMenuCloseDelay);
    },
    navigationMenuReposition(navElement) {
        console.log(navElement.getBoundingClientRect())
        this.navigationMenuClearCloseTimeout();
        this.$refs.navigationDropdown.style.left = navElement.offsetLeft + 'px';
        this.$refs.navigationDropdown.style.marginLeft = (navElement.offsetWidth/2) + 'px';
    },
    navigationMenuClearCloseTimeout(){
        clearTimeout(this.navigationMenuCloseTimeout);
    },
    navigationMenuClose(){
        this.navigationMenuOpen = false;
        this.navigationMenu = '';
    },
    menus: [
      {id:'cases', name: '工程案例', href:'/cases.html'},
      {id:'news', name: '资讯中心', href:'/news.html'},
      {id:'jobs', name: '诚邀才俊', href:'/jobs.html'},
      {id:'about', name: '关于我们', href:'/about.html'},
    ]
}" class="relative">
    <div class="relative ">
      <ul class="flex justify-center space-x-1 group ">
        <li
          class="flex flex-col items-center xl:min-w-[120px] after:block after:w-0 after:h-0.5 after:bg-primary after:transition-all after:duration-300 hover:after:w-full"
          :class="isLink==='index' ? 'text-primary after:w-full': ''">
          <a href="/" class="py-6" target="_blank">首页</a>
        </li>
        <li
          class="flex flex-col items-center xl:min-w-[120px] after:block after:w-0 after:h-0.5 after:bg-primary after:transition-all after:duration-300 hover:after:w-full focus:after:w-full"
          :class="{ 'after:w-full' : navigationMenu=='products', 'hover:after:w-full' : navigationMenu!='products' }">
          <button @mouseover="navigationMenuOpen=true; navigationMenuReposition($el); navigationMenu='products'"
            @mouseleave="navigationMenuLeave()" class="flex items-center py-6">
            <span>产品中心</span>
            <svg :class="{ '-rotate-180' : navigationMenuOpen==true && navigationMenu == 'products' }"
              class="relative top-[1px] ml-1 h-3 w-3 ease-out duration-300" xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
        </li>
        <template x-for="item in menus">
          <li
            class="flex flex-col items-center xl:min-w-[120px] after:block after:w-0 after:h-0.5 after:bg-primary after:transition-all after:duration-300 hover:after:w-full"
            :class="isLink===item.id ? 'text-primary after:w-full': ''">
            <a :href="item.href" class="py-6" target="_blank" x-text="item.name"></a>
          </li>
        </template>
      </ul>
    </div>
    <div x-ref="navigationDropdown" x-show="navigationMenuOpen" x-transition:enter="transition ease-out duration-100"
      x-transition:enter-start="opacity-0 scale-90" x-transition:enter-end="opacity-100 scale-100"
      x-transition:leave="transition ease-in duration-100" x-transition:leave-start="opacity-100 scale-100"
      x-transition:leave-end="opacity-0 scale-90" @mouseover="navigationMenuClearCloseTimeout()"
      @mouseleave="navigationMenuLeave()"
      class="absolute top-0 pt-3 duration-200 ease-out -translate-x-1/2 translate-y-18" x-cloak>
      <div
        class="flex justify-center w-auto h-auto overflow-hidden bg-white border rounded-md shadow-sm border-neutral-200/70">
        <div x-show="navigationMenu == 'products'" class="flex items-stretch justify-center w-full p-6">








        </div>
      </div>
    </div>
  </nav>

  <div class="flex items-center">
    <input type="search" placeholder="请输入内容" class="w-60 bg-[#f5f5f5] h-9 p-2 bg-no-repeat bg-right-2"
      style="background-image: url(/svg/search.svg)" />
  </div>
</header>
