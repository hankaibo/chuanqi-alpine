<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>产品中心 - 传麒科技</title>
    <base href="/temp/" />
    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <header x-data="headerData" class="fixed top-0 left-0 right-0 h-18 z-50 px-4 sm:px-8 lg:px-16 xl:px-32 2xl:px-64 text-white bg-[rgba(0,0,0,0.6)]">
      <div class="flex justify-between relative">
        <div class="flex items-center">
          <a href="/">
            <img src="/images/login/logo.webp" class="w-[100px]" />
          </a>
        </div>

        <nav
          x-data="{
              pIndex:0,
              cIndex:0,
              navigationMenuOpen: false,
              navigationMenu: '',
              navigationMenuCloseDelay: 200,
              navigationMenuCloseTimeout: null,
              navigationMenuLeave() {
                  let that = this;
                  this.navigationMenuCloseTimeout = setTimeout(() => {
                      that.navigationMenuClose();
                  }, this.navigationMenuCloseDelay);
              },
              navigationMenuReposition(navElement) {
                  this.navigationMenuClearCloseTimeout();
              },
              navigationMenuClearCloseTimeout(){
                  clearTimeout(this.navigationMenuCloseTimeout);
              },
              navigationMenuClose(){
                  this.navigationMenuOpen = false;
                  this.navigationMenu = '';
              },
              menus: [
                {id:'cases', name: '工程案例', href:'./cases.html'},
                {id:'news', name: '资讯中心', href:'./news.html'},
                {id:'jobs', name: '诚邀才俊', href:'./jobs.html'},
                {id:'about', name: '关于我们', href:'./about.html'},
              ]
          }"
        >
          <div class="relative">
            <ul class="flex justify-center space-x-1 group">
              <li class="nav-item--primary" :class="isLink==='index' ? 'text-primary after:w-full': ''">
                <a href="/" class="py-6" target="_blank">首页</a>
              </li>
              <li class="nav-item--primary focus:after:w-full" :class="{ 'after:w-full' : navigationMenu=='industries', 'hover:after:w-full' : navigationMenu!='industries' }">
                <button @mouseover="navigationMenuOpen=true; navigationMenuReposition($el); navigationMenu='industries'" @mouseleave="navigationMenuLeave()" class="flex items-center py-6">
                  <span>行业应用</span>
                  <svg
                    :class="{ '-rotate-180' : navigationMenuOpen==true && navigationMenu == 'industries' }"
                    class="relative top-[1px] ml-1 h-3 w-3 ease-out duration-300"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
              </li>
              <li
                class="nav-item--primary focus:after:w-full"
                :class="{ 'text-primary after:w-full' : navigationMenu=='products' || isLink =='products', 'hover:after:w-full' : navigationMenu!='products' }"
              >
                <button @mouseover="navigationMenuOpen=true; navigationMenuReposition($el); navigationMenu='products'" @mouseleave="navigationMenuLeave()" class="flex items-center py-6">
                  <span>产品中心</span>
                  <svg
                    :class="{ '-rotate-180' : navigationMenuOpen==true && navigationMenu == 'products' }"
                    class="relative top-[1px] ml-1 h-3 w-3 ease-out duration-300"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
              </li>
              <template x-for="item in menus">
                <li class="nav-item--primary" :class="isLink===item.id ? 'text-primary after:w-full': ''">
                  <a :href="item.href" class="py-6" target="_blank" x-text="item.name"></a>
                </li>
              </template>
            </ul>
          </div>
          <div
            x-ref="navigationDropdown"
            x-show="navigationMenuOpen"
            x-transition:enter="transition ease-out duration-100"
            x-transition:enter-start="opacity-0 scale-90"
            x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-100"
            x-transition:leave-start="opacity-100 scale-100"
            x-transition:leave-end="opacity-0 scale-90"
            @mouseover="navigationMenuClearCloseTimeout()"
            @mouseleave="navigationMenuLeave()"
            class="absolute top-0 left-0 right-0 pt-3 text-gray-700 duration-200 ease-out translate-y-18"
            x-cloak
          >
            <div class="flex justify-start w-auto h-auto overflow-hidden bg-white border rounded-md shadow-sm border-neutral-200/70">
              <div x-show="navigationMenu == 'industries'" class="flex justify-start w-full p-6">
                <div class="border-r border-r-[#f5f5f5]">
                  <ul class="w-60">
                    <template x-for="(item,index) in parentIndustries">
                      <li>
                        <div
                          class="flex justify-between items-center h-10 py-7 cursor-pointer hover:text-primary hover:bg-primary/10"
                          :class="index === pIndex?'text-primary bg-primary/10':''"
                          @mouseover="pIndex=index, cIndex=0, childIndustry=item.children"
                        >
                          <span class="flex items-center">
                            <img src="./images/logo.webp" class="w-4 h-4" />
                            <span class="pl-2 text-black" x-text="item.name"></span>
                          </span>
                          <svg
                            class="text-gray-200 w-4 h-4"
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-chevron-down"
                          >
                            <path d="m6 9 6 6 6-6" />
                          </svg>
                        </div>
                      </li>
                    </template>
                  </ul>
                </div>
                <div class="border-r border-r-[#f5f5f5]">
                  <ul class="w-60">
                    <template x-for="(item,index) in childIndustry">
                      <li>
                        <div
                          class="flex justify-between items-center h-10 py-7 cursor-pointer hover:text-primary hover:bg-primary/10"
                          :class="index === cIndex ?'text-primary bg-primary/10':''"
                          @mouseover="cIndex=index, grandsonIndustry=item.children"
                        >
                          <span class="pl-2 text-black" x-text="item.name"></span>
                          <svg
                            class="text-gray-200 w-4 h-4"
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-chevron-down"
                          >
                            <path d="m6 9 6 6 6-6" />
                          </svg>
                        </div>
                      </li>
                    </template>
                  </ul>
                </div>
                <div class="flex-1">
                  <div class="flex flex-wrap">
                    <template x-for="item in grandsonIndustry">
                      <div class="sm:w-full xl:w-1/2 2xl:w-1/3 mb-4">
                        <div class="pl-8 text-[#4EB0B3] mb-2.5" x-text="item.name"></div>
                        <template x-for="it in item.children">
                          <div class="flex items-center pl-8 cursor-pointer" @click="handleProductDetail(it.id)">
                            <img class="w-10 h-10 object-cover" :src="it.cover" />
                            <span class="pl-2 text-black hover:text-primary" x-text="it.name"></span>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <div x-show="navigationMenu == 'products'" class="flex justify-start w-full p-6">
                <div class="border-r border-r-[#f5f5f5]">
                  <ul class="w-60">
                    <template x-for="(item,index) in parentCategories">
                      <li>
                        <div
                          class="flex justify-between items-center h-10 py-7 cursor-pointer hover:text-primary hover:bg-primary/10"
                          :class="index === pIndex?'text-primary bg-primary/10':''"
                          @mouseover="pIndex=index, cIndex=0, childCategory=item.children"
                        >
                          <span class="flex items-center">
                            <img src="./images/logo.webp" class="w-4 h-4" />
                            <span class="pl-2 text-black" x-text="item.name"></span>
                          </span>
                          <svg
                            class="text-gray-200 w-4 h-4"
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-chevron-down"
                          >
                            <path d="m6 9 6 6 6-6" />
                          </svg>
                        </div>
                      </li>
                    </template>
                  </ul>
                </div>
                <div class="border-r border-r-[#f5f5f5]">
                  <ul class="w-60">
                    <template x-for="(item,index) in childCategory">
                      <li>
                        <div
                          class="flex justify-between items-center h-10 py-7 cursor-pointer hover:text-primary hover:bg-primary/10"
                          :class="index === cIndex ?'text-primary bg-primary/10':''"
                          @mouseover="cIndex=index, grandsonCategory=item.children"
                        >
                          <span class="pl-2 text-black" x-text="item.name"></span>
                          <svg
                            class="text-gray-200 w-4 h-4"
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-chevron-down"
                          >
                            <path d="m6 9 6 6 6-6" />
                          </svg>
                        </div>
                      </li>
                    </template>
                  </ul>
                </div>
                <div class="flex-1">
                  <div class="flex flex-wrap">
                    <template x-for="item in grandsonCategory">
                      <div class="sm:w-full xl:w-1/2 2xl:w-1/3 mb-4">
                        <div class="pl-8 text-primary mb-2.5" x-text="item.name"></div>
                        <template x-for="it in item.productList">
                          <div class="flex items-start mb-2 cursor-pointer" @click="handleProductDetail(it.id)">
                            <img class="w-10 h-10 object-cover" :src="it.cover" />
                            <span class="pl-2 text-black hover:text-primary" x-text="it.name"></span>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </nav>

        <div class="inline-flex items-center">
          <input type="search" placeholder="请输入内容" class="w-60 bg-[#f5f5f5] h-9 p-2 bg-no-repeat bg-right-2" style="background-image: url(/svg/search.svg)" />
        </div>
      </div>
    </header>

    <main x-data="data" class="flex flex-col justify-between">
      <div class="bg-[#f6f7f8] px-4 sm:px-8 lg:px-16 xl:px-32 2xl:px-64 top">
        <div class="-mx-4 sm:-mx-8 lg:-mx-16 xl:-mx-32 2xl:-mx-64">
          <img src="./images/product.webp" class="bg-no-repeat bg-[length:100%_auto]" alt="banner" />
        </div>

        <div class="mt-2 sm:mt-4">
          <div x-data="tabsData" class="relative w-full">
            <div x-ref="tabButtons" class="relative">
              <div class="relative flex items-center text-gray-500 bg-white select-none py-2">
                <template x-for="tab in tabs" :key="tab.id">
                  <button
                    :id="$id(tabId)"
                    @click="tabButtonClicked($el, tab);"
                    type="button"
                    :class="{ 'text-primary' : tabButtonActive($el) }"
                    class="text-lg font-semibold px-12 z-20 inline-flex items-center justify-center h-8 transition-all cursor-pointer whitespace-nowrap"
                    x-text="tab.name"
                  ></button>
                </template>
              </div>
              <div class="relative z-10 w-full h-0.5 bg-white" x-cloak>
                <div x-ref="tabMarker" class="absolute w-40 h-full bg-primary duration-300 ease-out"></div>
              </div>
            </div>

            <div class="relative flex items-center justify-start w-full py-5 mt-2 text-xs text-gray-400 content">
              <template x-for="tab in tabs" :key="tab.id">
                <div :id="$id(tabId + '-content')" x-show="tabContentActive($el)" class="w-full">
                  <template x-for="tabContent in tabContents" :key="tabContent.id">
                    <div
                      x-data="{
                        activeAccordion: '',
                        setActiveAccordion(id) {
                            this.activeAccordion = (this.activeAccordion == id) ? '' : id
                        }
                      }"
                      class="relative w-full mx-auto overflow-hidden text-sm font-normal"
                    >
                      <div x-data="{ id: $id('accordion') }" class="cursor-pointer">
                        <button @click="setActiveAccordion(id)" class="bg-white border border-gray-100 flex items-center justify-between w-full p-4 text-left select-none">
                          <span x-text="tabContent.name"></span>
                          <svg
                            class="w-4 h-4 duration-200 ease-out"
                            :class="{ 'rotate-180': activeAccordion==id }"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          >
                            <polyline points="6 9 12 15 18 9"></polyline>
                          </svg>
                        </button>
                        <div x-show="activeAccordion==id" x-collapse x-cloak>
                          <div class="relative grid grid-cols-1 gap-4 py-4 lg:grid-cols-2 lg:gap-6 lg:pb-6 xl:grid-cols-3 xl:gap-8 xl:pb-8">
                            <template x-for="product in tabContent.productList" :key="product.id">
                              <div @click="handleDetail(product)" class="shadow-lg cursor-pointer hover:-translate-y-5 transition duration-300 group">
                                <div class="w-full h-56">
                                  <img class="w-full h-full cursor-pointer object-cover" :src="product.imageUrl" />
                                </div>

                                <div
                                  class="flex justify-start items-center h-16 py-2.5 px-5 relative overflow-hidden text-ellipsis line-clamp-2 z-[1] before:absolute before:bottom-0 before:left-0 before:w-0 group-hover:before:w-full before:h-full before:bg-[#4eb0b3] before:transition-all before:duration-300 before:-z-[1]"
                                >
                                  <h3 class="group-hover:text-white text-xl text-[#333]" x-text="product.name"></h3>
                                </div>
                              </div>
                            </template>
                          </div>
                          <template x-if="tabContent.productList?.length===0 || !tabContent.productList">
                            <div class="flex justify-center items-center flex-col text-center py-10 h-80 w-full">
                              <svg viewBox="0 0 79 86" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                                <defs>
                                  <linearGradient id="linearGradient-1-16" x1="38.8503086%" y1="0%" x2="61.1496914%" y2="100%">

                                  </linearGradient>

                                  </linearGradient>
                                  <rect id="path-3-16" x="0" y="0" width="17" height="36"></rect>
                                </defs>
                                <g id="Illustrations" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                                  <g id="B-type" transform="translate(-1268.000000, -535.000000)">
                                    <g id="Group-2" transform="translate(1268.000000, 535.000000)">

                                        fill="#F7F8FC"

                                        ></polygon>
                                      </g>
                                      <rect id="Rectangle-Copy-15" fill="url(#linearGradient-2-16)" x="13" y="45" width="40" height="36"></rect>
                                      <g id="Rectangle-Copy-17" transform="translate(53.000000, 45.000000)">

                                        ></polygon>
                                      </g>
                                      <polygon
                                        id="Rectangle-Copy-18"
                                        fill="#F8F9FB"
                                        transform="translate(66.000000, 51.500000) scale(-1, 1) translate(-66.000000, -51.500000) "
                                        points="62 45 79 45 70 58 53 58"

                                    </g>
                                  </g>
                                </g>
                              </svg>
                              <div>暂无数据</div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="p-16 pb-5 bg-[#171c2f] lg:px-16 xl:px-32 2xl:px-64 divide-y divide-[#353948]">
      <div class="pb-5 flex justify-between">
        <ul
          x-data="{
            products:['DEWE产品系列', 'CPSS定制化电源系统', '功率分析仪及电流信号采集仪', '电力仿真系统', '检测装备及集成系统']
          }"
        >
          <li class="text-base font-medium text-[#d8d8d8] pb-2.5">产品中心</li>
          <template x-for="product in products">
            <li class="text-sm font-normal text-[#888888] pb-2" x-text="product"></li>
          </template>
        </ul>
        <ul
          x-data="{
            solutions:['新能源检测', '轨道交通', '传统电力系统', '其他能源测试']
          }"
        >
          <li class="text-base font-medium text-[#d8d8d8] pb-2.5">解决方案</li>
          <template x-for="solution in solutions">
            <li class="text-sm font-normal text-[#888888] pb-2" x-text="solution"></li>
          </template>
        </ul>
        <ul
          x-data="{
            cases:['新能源应用', '轨道交通', '电力系统应用']
          }"
        >
          <li class="text-base font-medium text-[#d8d8d8] pb-2.5">案例展示</li>
          <template x-for="c in cases">
            <li class="text-sm font-normal text-[#888888] pb-2" x-text="c"></li>
          </template>
        </ul>
        <ul
          x-data="{
            news:['公司新闻', '行业新闻']
          }"
        >
          <li class="text-base font-medium text-[#d8d8d8] pb-2.5">新闻中心</li>
          <template x-for="n in news">
            <li class="text-sm font-normal text-[#888888] pb-2" x-text="n"></li>
          </template>
        </ul>
        <ul
          x-data="{
            abouts:['公司简介', '资质荣誉', '晋升空间', '组织架构']
          }"
        >
          <li class="text-base font-medium text-[#d8d8d8] pb-2.5">关于我们</li>
          <template x-for="about in abouts">
            <li class="text-sm font-normal text-[#888888] pb-2" x-text="about"></li>
          </template>
        </ul>
        <ul>
          <li class="text-base font-medium text-[#d8d8d8] pb-2.5">微信二维码</li>
          <li>
            <img class="w-24 h-24" src="/images/weixin.webp" />
          </li>
        </ul>
      </div>
