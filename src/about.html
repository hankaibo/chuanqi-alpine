<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于我们 - 传麒科技</title>
    <meta name="description" content="Put your description here." />
    <base href="%BASE_URL%" />
    <link rel="icon" href="/favicon.ico" />
    <link href="/wangeditor.css" rel="stylesheet" />
    <script src="https://api.tianditu.gov.cn/api?v=4.0&tk=7849160b3337ee15b4cd1b3d4d71d8a3" defer></script>
  </head>

  <body>
    <div x-data="headerData('about')">
      <!-- #include partials/header.html -->
      <!-- #include partials/header-mobile.html -->
    </div>

    <main x-data="data" x-init="getList()" class="flex flex-col justify-between">
      <div class="bg-[#f6f7f8] bg-[url(./images/about.webp)] bg-no-repeat bg-[length:100%_auto] container-primary">
        <div class="lg:bg-[url(./images/about-point.webp)] lg:bg-right-bottom lg:bg-no-repeat lg:pb-7 3xl:bg-[90%_75%]">
          <div
            class="mt-24 p-2 rounded-t-[20px] bg-white sm:mt-40 sm:p-8 lg:mt-64 lg:rounded-tl-[50px] lg:rounded-tr-none lg:rounded-br-[50px] xl:mt-64 xl:py-7 xl:rounded-tl-[100px] xl:rounded-tr-none xl:rounded-br-[100px] 2xl:mt-[400px] 3xl:mb-64"
          >
            <div id="editor-container" class="text-xs sm:text-sm lg:text-base min-h-80"></div>

            <div class="flex flex-wrap">
              <div class="basis-1/2 flex justify-center items-center 2xl:basis-1/5">
                <div class="basis-1/3 2xl:hidden"></div>
                <div class="basis-2/3 flex justify-center 2xl:basis-full">
                  <div class="flex flex-col justify-center w-24 h-24 bg-[url('./images/about-1.webp')] bg-no-repeat bg-[length:100%_100%] sm:w-40 sm:h-40 lg:w-56 lg:h-56 2xl:w-48 2xl:h-48">
                    <div class="flex flex-col justify-center items-center gap-1 after:w-2 after:h-0.5 after:bg-primary sm:gap-2 lg:after:w-4 lg:after:h-1">
                      <span class="text-white text-xs lg:text-lg 3xl:text-3xl"> 使命 </span>
                    </div>
                    <div class="text-white text-[10px] text-center pt-2 px-3 lg:text-sm" x-text="aboutData.mission"></div>
                  </div>
                </div>
              </div>
              <div class="basis-1/2 flex justify-center items-center 2xl:basis-1/5">
                <div class="basis-2/3 flex justify-center 2xl:basis-full">
                  <div class="flex flex-col justify-center w-24 h-24 bg-[url('./images/about-2.webp')] bg-no-repeat bg-[length:100%_100%] sm:w-40 sm:h-40 lg:w-56 lg:h-56 2xl:w-48 2xl:h-48">
                    <div class="flex flex-col justify-center items-center gap-1 after:w-2 after:h-0.5 after:bg-primary sm:gap-2 lg:after:w-4 lg:after:h-1">
                      <span class="text-white text-xs lg:text-lg 3xl:text-3xl"> 宗旨 </span>
                    </div>
                    <div class="text-white text-[10px] text-center pt-2 px-3 lg:text-sm" x-text="aboutData.objective"></div>
                  </div>
                </div>
                <div class="basis-1/3 2xl:hidden"></div>
              </div>
              <div class="basis-1/3 flex justify-center items-center 2xl:basis-1/5">
                <div class="flex flex-col justify-center w-24 h-24 bg-[url('./images/about-3.webp')] bg-no-repeat bg-[length:100%_100%] sm:w-40 sm:h-40 lg:w-56 lg:h-56 2xl:w-48 2xl:h-48">
                  <div class="flex flex-col justify-center items-center gap-1 after:w-2 after:h-0.5 after:bg-primary sm:gap-2 lg:after:w-4 lg:after:h-1">
                    <span class="text-white text-xs lg:text-lg 3xl:text-3xl"> 愿景 </span>
                  </div>
                  <div class="text-white text-[10px] text-center pt-2 px-3 lg:text-sm" x-text="aboutData.vision"></div>
                </div>
              </div>
              <div class="basis-1/3 flex justify-center items-center 2xl:basis-1/5">
                <div class="flex flex-col justify-center w-24 h-24 bg-[url('./images/about-4.webp')] bg-no-repeat bg-[length:100%_100%] sm:w-40 sm:h-40 lg:w-56 lg:h-56 2xl:w-48 2xl:h-48">
                  <div class="flex flex-col justify-center items-center gap-1 after:w-2 after:h-0.5 after:bg-primary sm:gap-2 lg:after:w-4 lg:after:h-1">
                    <span class="text-white text-xs lg:text-lg 3xl:text-3xl"> 运营理念 </span>
                  </div>
                  <div class="text-white text-[10px] text-center pt-2 px-3 lg:text-sm" x-text="aboutData.concept"></div>
                </div>
              </div>
              <div class="basis-1/3 flex justify-center items-center 2xl:basis-1/5">
                <div class="flex flex-col justify-center w-24 h-24 bg-[url('./images/about-5.webp')] bg-no-repeat bg-[length:100%_100%] sm:w-40 sm:h-40 lg:w-56 lg:h-56 2xl:w-48 2xl:h-48">
                  <div class="flex flex-col justify-center items-center gap-1 after:w-2 after:h-0.5 after:bg-primary sm:gap-2 lg:after:w-4 lg:after:h-1">
                    <span class="text-white text-xs lg:text-lg 3xl:text-3xl"> 精神 </span>
                  </div>
                  <div class="text-white text-[10px] text-center pt-2 px-3 lg:text-sm" x-text="aboutData.spirit"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="-container-primary bg-[url(./images/about-carousel.webp)] bg-no-repeat bg-cover">
          <div class="relative p-4 sm:p-8 lg:p-16 xl:p-32 2xl:p-64">
            <div class="flex flex-col justify-center items-center gap-2 after:w-4 after:h-0.5 after:bg-primary lg:gap-4 lg:after:w-8 lg:after:h-1.5">
              <span class="text-xl text-white lg:text-4xl"> 荣誉资质 </span>
            </div>
            <!-- Slider main container -->
            <div class="swiper mt-5 lg:my-16" x-ref="swiperRef">
              <div class="swiper-wrapper">
                <template x-for="item in aboutData.files" :key="item.id">
                  <div class="swiper-slide">
                    <div class="flex justify-center items-center px-5 sm:px-32 lg:px-4">
                      <div class="w-full h-full px-3 pb-3 bg-white lg:w-60 lg:h-80 3xl:w-80 3xl:h-96 3xl:p-5">
                        <img :src="item.path" class="w-full h-full" loading="lazy" />
                      </div>
                    </div>
                  </div>
                </template>
              </div>
              <!-- If we need pagination -->
              <div class="swiper-pagination swiper-pagination-inner"></div>

              <!-- If we need navigation buttons -->
              <div class="swiper-button-prev" :class="{ '!hidden': isMobile }"></div>
              <div class="swiper-button-next" :class="{ '!hidden': isMobile }"></div>
            </div>
          </div>
        </div>

        <div id="map" class="mt-4 sm:py-4 lg:mt-16">
          <div class="flex flex-col justify-center items-center gap-2 mb-3 after:w-4 after:h-0.5 after:bg-primary lg:gap-4 lg:after:w-8 lg:after:h-1.5 lg:mb-10">
            <h2 class="text-xl lg:text-4xl xl:text-4xl text-black">联系我们</h2>
          </div>
          <div class="columns-1 lg:columns-2 lg:gap-8 xl:gap-12 2xl:gap-16">
            <template x-for="item in mapList" :key="item.id">
              <div class="mb-5 lg:mb-6 break-inside-avoid">
                <div class="flex flex-col justify-center items-start gap-2 after:w-4 after:h-0.5 after:bg-primary">
                  <h3 class="text-lg text-black lg:text-2xl" x-text="item.name"></h3>
                </div>
                <div class="flex flex-col mt-3 gap-2">
                  <div class="flex items-center space-x-8">
                    <div class="flex items-center">
                      <span class="text-[#d8d8d8]">
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          width="24"
                          height="24"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          class="icon icon-tabler icons-tabler-outline icon-tabler-device-mobile w-4 h-4"
                        >
                          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                          <path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14z" />
                          <path d="M11 4h2" />
                          <path d="M12 17v.01" />
                        </svg>
                      </span>
                      <span class="pl-1 text-xs 2xl:text-base 3xl:text-lg text-[#333] lg:text-lg" x-text="item.mobile"></span>
                    </div>
                    <div class="flex items-center">
                      <span class="text-[#d8d8d8]">
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          width="24"
                          height="24"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          class="icon icon-tabler icons-tabler-outline icon-tabler-phone w-4 h-4"
                        >
                          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                          <path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2" />
                        </svg>
                      </span>
                      <span class="pl-1 text-xs 2xl:text-base 3xl:text-lg text-[#333] lg:text-lg" x-text="item.phone"></span>
                    </div>
                  </div>
                  <div class="flex justify-start items-center">
                    <span class="text-[#d8d8d8]">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-mail w-4 h-4"
                      >
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10z" />
                        <path d="M3 7l9 6l9 -6" />
                      </svg>
                    </span>
                    <span class="pl-1 text-xs 2xl:text-base 3xl:text-lg text-[#333] lg:text-lg" x-text="item.email"></span>
                  </div>
                  <div class="flex justify-start items-center">
                    <span class="text-[#d8d8d8]">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-map-pin w-4 h-4"
                      >
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
                        <path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0z" />
                      </svg>
                    </span>
                    <span class="pl-1 text-xs 2xl:text-base 3xl:text-lg text-[#333] lg:text-lg" x-text="item.address"></span>
                  </div>
                  <div class="flex justify-start items-center -mt-1">
                    <span class="pl-5 text-xs 2xl:text-base 3xl:text-sm text-[#333] box-decoration-clone lg:h-8 lg:text-sm 2xl:h-12" x-text="item.addressEN"></span>
                  </div>
                </div>
                <div class="mt-3 lg:mt-5">
                  <div class="map h-[400px]" :id="item.id"></div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </main>

    <div x-data="footerData">
      <!-- #include partials/footer.html -->
      <!-- #include partials/footer-mobile.html -->
    </div>

    <script type="module" src="./about.js"></script>
  </body>
</html>
