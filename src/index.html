<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body
    x-data="{
    header:'',
    footer:''
  }"
    x-init="()=>{
      fetch('header.html').then(res=>res.text()).then(text=>header=text);
      fetch('footer.html').then(res=>res.text()).then(text=>footer=text);
      }"
  >
    <div x-html="header"></div>
    <main></main>
    <div x-html="footer"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
