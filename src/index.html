<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>传麒科技</title>
    <meta name="description" content="Put your description here." />
    <base href="/temp/" />
    <link rel="icon" href="/favicon.ico" />
    <link href="https://unpkg.com/@wangeditor/editor@latest/dist/css/style.css" rel="stylesheet" />
    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div x-data="data">
      <header class="fixed top-0 left-0 right-0 h-18 z-50 px-4 sm:px-8 lg:px-16 xl:px-32 2xl:px-64" :class="swiperIndex ?'bg-white text-black shadow' : 'text-white bg-[rgba(0,0,0,0.6)]'">
        <div class="flex justify-between relative">
          <div class="flex items-center">
            <a href="/">
              <img src="/images/login/logo.webp" class="w-[100px]" />
            </a>
          </div>

          <nav
            x-data="{
                navigationMenuOpen: false,
                navigationMenu: '',
                navigationMenuCloseDelay: 200,
                navigationMenuCloseTimeout: null,
                navigationMenuLeave() {
                    let that = this;
                    this.navigationMenuCloseTimeout = setTimeout(() => {
                        that.navigationMenuClose();
                    }, this.navigationMenuCloseDelay);
                },
                navigationMenuReposition(navElement) {
                    this.navigationMenuClearCloseTimeout();
                },
                navigationMenuClearCloseTimeout(){
                    clearTimeout(this.navigationMenuCloseTimeout);
                },
                navigationMenuClose(){
                    this.navigationMenuOpen = false;
                    this.navigationMenu = '';
                },
                menus: [
                  {id:'cases', name: '工程案例', href:'./cases.html'},
                  {id:'news', name: '资讯中心', href:'./news.html'},
                  {id:'jobs', name: '诚邀才俊', href:'./jobs.html'},
                  {id:'about', name: '关于我们', href:'./about.html'},
                ]
            }"
          >
            <div class="relative">
              <ul class="flex justify-center space-x-1 group">
                <li
                  class="flex flex-col items-center xl:min-w-[120px] after:block after:w-0 after:h-0.5 after:bg-primary after:transition-all after:duration-300 hover:after:w-full"
                  :class="isLink==='index' ? 'text-primary after:w-full': ''"
                >
                  <a href="/" class="py-6" target="_blank">首页</a>
                </li>
                <li
                  class="flex flex-col items-center xl:min-w-[120px] after:block after:w-0 after:h-0.5 after:bg-primary after:transition-all after:duration-300 hover:after:w-full focus:after:w-full"
                  :class="{ 'after:w-full' : navigationMenu=='industries', 'hover:after:w-full' : navigationMenu!='industries' }"
                >
                  <button @mouseover="navigationMenuOpen=true; navigationMenuReposition($el); navigationMenu='industries'" @mouseleave="navigationMenuLeave()" class="flex items-center py-6">
                    <span>行业应用</span>
                    <svg
                      :class="{ '-rotate-180' : navigationMenuOpen==true && navigationMenu == 'industries' }"
                      class="relative top-[1px] ml-1 h-3 w-3 ease-out duration-300"
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </button>
                </li>
                <li
                  class="flex flex-col items-center xl:min-w-[120px] after:block after:w-0 after:h-0.5 after:bg-primary after:transition-all after:duration-300 hover:after:w-full focus:after:w-full"
                  :class="{ 'after:w-full' : navigationMenu=='products', 'hover:after:w-full' : navigationMenu!='products' }"
                >
                  <button @mouseover="navigationMenuOpen=true; navigationMenuReposition($el); navigationMenu='products'" @mouseleave="navigationMenuLeave()" class="flex items-center py-6">
                    <span>产品中心</span>
                    <svg
                      :class="{ '-rotate-180' : navigationMenuOpen==true && navigationMenu == 'products' }"
                      class="relative top-[1px] ml-1 h-3 w-3 ease-out duration-300"
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </button>
                </li>
                <template x-for="item in menus">
                  <li
                    class="flex flex-col items-center xl:min-w-[120px] after:block after:w-0 after:h-0.5 after:bg-primary after:transition-all after:duration-300 hover:after:w-full"
                    :class="isLink===item.id ? 'text-primary after:w-full': ''"
                  >
                    <a :href="item.href" class="py-6" target="_blank" x-text="item.name"></a>
                  </li>
                </template>
              </ul>
            </div>
            <div
              x-ref="navigationDropdown"
              x-show="navigationMenuOpen"
              x-transition:enter="transition ease-out duration-100"
              x-transition:enter-start="opacity-0 scale-90"
              x-transition:enter-end="opacity-100 scale-100"
              x-transition:leave="transition ease-in duration-100"
              x-transition:leave-start="opacity-100 scale-100"
              x-transition:leave-end="opacity-0 scale-90"
              @mouseover="navigationMenuClearCloseTimeout()"
              @mouseleave="navigationMenuLeave()"
              class="absolute top-0 left-0 right-0 pt-3 text-gray-700 duration-200 ease-out translate-y-18"
              x-cloak
            >
              <div class="flex justify-start w-auto h-auto overflow-hidden bg-white border rounded-md shadow-sm border-neutral-200/70">
                <div x-show="navigationMenu == 'industries'" class="flex justify-start w-full p-6">
                  <div class="border-r border-r-[#f5f5f5]">
                    <ul class="w-60">
                      <template x-for="item in parentIndustries">
                        <li>
                          <div
                            class="flex justify-between items-center h-10 py-7 cursor-pointer hover:text-primary hover:bg-primary/10"
                            :class="item.id ===childIndustry.id ?'text-primary bg-primary/10':''"
                            @mouseover="childIndustry=item"
                          >
                            <span class="flex items-center">
                              <img src="./images/logo.webp" class="w-4 h-4" />
                              <span class="pl-2 text-black" x-text="item.name"></span>
                            </span>
                            <svg
                              class="text-gray-200 w-4 h-4"
                              xmlns="http://www.w3.org/2000/svg"
                              width="24"
                              height="24"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              class="lucide lucide-chevron-down"
                            >
                              <path d="m6 9 6 6 6-6" />
                            </svg>
                          </div>
                        </li>
                      </template>
                    </ul>
                  </div>
                  <div class="border-r border-r-[#f5f5f5]">
                    <ul class="w-60">
                      <template x-for="item in childIndustry.children">
                        <li>
                          <div
                            class="flex justify-between items-center h-10 py-7 cursor-pointer hover:text-primary hover:bg-primary/10"
                            :class="item.id ===grandsonIndustry.id ?'text-primary bg-primary/10':''"
                            @mouseover="grandsonIndustry=item"
                          >
                            <span class="pl-2 text-black" x-text="item.name"></span>
                            <svg
                              class="text-gray-200 w-4 h-4"
                              xmlns="http://www.w3.org/2000/svg"
                              width="24"
                              height="24"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              class="lucide lucide-chevron-down"
                            >
                              <path d="m6 9 6 6 6-6" />
                            </svg>
                          </div>
                        </li>
                      </template>
                    </ul>
                  </div>
                  <div class="py-2.5 w-96">
                    <div class="flex flex-wrap">
                      <template x-for="item in grandsonIndustry.children">
                        <div class="sm:w-full xl:w-1/2 2xl:w-1/3 mb-4">
                          <div class="pl-8 text-[#4EB0B3] mb-2.5" x-text="item.name"></div>
                          <div class="flex items-center pl-8 cursor-pointer hover:text-primary">
                            <template x-for="it in item.children">
                              <img style="width: 40px; height: 40px" :src="pp.fileUrl" fit="fit" />
                              <span class="pl-2 text-black" x-text="it.name"></span>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>

                <div x-show="navigationMenu == 'products'" class="flex justify-start w-full p-6">
                  <div class="border-r border-r-[#f5f5f5]">
                    <ul class="w-60">
                      <template x-for="item in parentCategories">
                        <li>
                          <div
                            class="flex justify-between items-center h-10 py-7 cursor-pointer hover:text-primary hover:bg-primary/10"
                            :class="item.id ===childCategory.id ?'text-primary bg-primary/10':''"
                            @mouseover="childCategory=item"
                          >
                            <span class="flex items-center">
                              <img src="./images/logo.webp" class="w-4 h-4" />
                              <span class="pl-2 text-black" x-text="item.name"></span>
                            </span>
                            <svg
                              class="text-gray-200 w-4 h-4"
                              xmlns="http://www.w3.org/2000/svg"
                              width="24"
                              height="24"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              class="lucide lucide-chevron-down"
                            >
                              <path d="m6 9 6 6 6-6" />
                            </svg>
                          </div>
                        </li>
                      </template>
                    </ul>
                  </div>
                  <div class="border-r border-r-[#f5f5f5]">
                    <ul class="w-60">
                      <template x-for="item in childCategory.children">
                        <li>
                          <div
                            class="flex justify-between items-center h-10 py-7 cursor-pointer hover:text-primary hover:bg-primary/10"
                            :class="item.id ===grandsonCategory.id ?'text-primary bg-primary/10':''"
                            @mouseover="grandsonCategory=item"
                          >
                            <span class="pl-2 text-black" x-text="item.name"></span>
                            <svg
                              class="text-gray-200 w-4 h-4"
                              xmlns="http://www.w3.org/2000/svg"
                              width="24"
                              height="24"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              class="lucide lucide-chevron-down"
                            >
                              <path d="m6 9 6 6 6-6" />
                            </svg>
                          </div>
                        </li>
                      </template>
                    </ul>
                  </div>
                  <div class="flex-1">
                    <div class="flex flex-wrap">
                      <template x-for="item in grandsonCategory.children">
                        <div class="sm:w-full xl:w-1/2 2xl:w-1/3 mb-4">
                          <div class="pl-8 text-primary mb-2.5" x-text="item.name"></div>
                          <div class="flex items-center pl-8 cursor-pointer hover:text-primary">
                            <template x-for="it in item.children">
                              <img style="width: 40px; height: 40px" :src="pp.fileUrl" fit="fit" />
                              <span class="pl-2 text-black" x-text="it.name"></span>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </nav>

          <div class="inline-flex items-center">
            <input type="search" placeholder="请输入内容" class="w-60 bg-[#f5f5f5] h-9 p-2 bg-no-repeat bg-right-2" style="background-image: url(/svg/search.svg)" />
          </div>
        </div>
      </header>

      <main class="h-screen">
        <!-- Swiper -->
        <template x-if="!isMobile">
          <div class="swiper swiper-outer w-full h-full" x-ref="outerSwiper">
            <div class="swiper-wrapper">
              <!-- 嵌套的产品轮播图  -->
              <div class="swiper-slide">
                <div class="swiper swiper-inner w-full h-full" x-ref="innerSwiper">
                  <div class="swiper-wrapper">
                    <template x-for="product in products" :key="product.id">
                      <div class="swiper-slide">
                        <div class="w-full h-full relative">
                          <img :src="product.imageUrl" :alt="product.name" class="w-full h-full object-cover" loading="lazy" />
                          <div class="absolute top-1/3 left-[260px] flex flex-col text-white">
                            <span class="text-5xl mb-7" x-text="product.name"></span>
                            <button class="btn-primary w-40" @click="handleProductDetail(product.id)">查看详情</button>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                  <div class="swiper-pagination swiper-pagination-inner"></div>
                </div>
              </div>
              <!-- 行业应用 -->
              <div class="swiper-slide">
                <section class="flex flex-col justify-start items-center h-full lg:pt-[72px] bg-white top">
                  <h2 class="flex flex-col justify-center items-center py-4 lg:py-8 xl:py-16">
                    <span class="text-xl lg:text-2xl 3xl:text-4xl font-medium text-black pb-2">行业应用</span>
                    <span class="divider-primary"></span>
                    <span class="text-xs lg:text-lg text-[#d8d8d8] pt-1">Industry application</span>
                  </h2>
                  <div class="flex lg:gap-4 xl:gap-8 pb-4 lg:pb-8 xl:pb-16 h-full">
                    <template x-for="(industry, index) in industries" :key="industry.id">
                      <div x-data="{show: false}" class="relative flex-1" @mouseenter="show=true" @mouseleave="show=false">
                        <div class="relative cursor-pointer flex flex-col justify-center h-full">
                          <img :src="industry?.imageUrl" class="w-full h-full object-cover" loading="lazy" />
                          <h3
                            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 lg:text-3xl xl:text-4xl font-medium text-white after:w-9 after:h-1 after:bg-white after:block after:my-3 after:mx-auto"
                            x-text="industry.name"
                          ></h3>
                        </div>
                        <div
                          x-show="show"
                          x-transition:enter="transition ease-out duration-300 transform"
                          x-transition:enter-start="translate-y-full opacity-0"
                          x-transition:enter-end="translate-y-0 opacity-100"
                          x-transition:leave="transition ease-in duration-300 transform"
                          x-transition:leave-start="translate-y-0 opacity-100"
                          x-transition:leave-end="translate-y-full opacity-0"
                          class="absolute inset-0 flex flex-col justify-center items-center"
                        >
                          <div
                            class="relative bg-[rgba(78,176,179,0.35)] backdrop-blur-[10px] w-full h-full p-12 before:absolute before:top-0 before:w-1.5 before:h-full before:bg-white after:absolute after:top-0 after:w-1.5 after:h-full after:bg-primary"
                            :class="{
                          'before:-right-1.5': index < 2,
                          'after:-right-3': index < 2,
                          'before:-left-1.5': index > 1,
                          'after:-left-3': index > 1,
                        }"
                          >
                            <h3 class="relative h-12 text-3xl font-medium text-white pb-5 after:absolute after:left-0 after:bottom-0 after:w-8 after:h-1 after:bg-white" x-text="industry.name"></h3>
                            <ul class="mt-10">
                              <template x-for="it in industry?.children" :key="it.id">
                                <li
                                  class="flex justify-between items-center p-1 text-xl text-white border-b border-b-transparent cursor-pointer transition-all hover:font-semibold hover:transition-all hover:border-b hover:border-b-slate-50 group"
                                >
                                  <span x-text="it.name"></span>
                                </li>
                              </template>
                            </ul>
                            <button class="absolute bottom-12 left-12 btn-second" @click="handleMore(industry)">查看更多>></button>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </section>
              </div>
              <!-- 产品分类 -->
              <template x-for="category in categories" :key="category.id">
                <div class="swiper-slide">
                  <section class="flex flex-col lg:flex-row lg:h-full items-start lg:items-stretch bg-[url(./images/index-product-bg.webp)] bg-no-repeat bg-right-bottom lg:pt-[72px]">
                    <div class="relative lg:basis-2/3">
                      <img :src="category.indexFile?.path" class="w-full h-full object-cover" loading="lazy" />
                      <div class="absolute left-0 bottom-0 right-0 p-4 xl:p-9 gradient-box">
                        <div class="flex flex-col gap-1.5 mb-3 after:w-5 after:h-0.5 after:bg-primary lg:gap-4 lg:after:w-8 lg:after:h-1.5 lg:mb-5">
                          <span class="text-lg lg:text-4xl text-white" x-text="category.name"></span>
                        </div>
                        <div class="text-sm text-white leading-normal" x-text="category.description"></div>
                      </div>
                    </div>
                    <div class="lg:basis-1/3 p-4 xl:px-8 xl:py-16 2xl:px-16 2xl:py-24 w-full">
                      <svg
                        class="fill-current overflow-hidden w-9 h-9 lg:w-12 lg:h-12 xl:w-20 xl:h-20"
                        viewBox="0 0 20 20"
                        version="1.1"
                        xmlns="http://www.w3.org/2000/svg"
                        xmlns:xlink="http://www.w3.org/1999/xlink"
                      >
                        <title>icon</title>
                        <defs>
                          <polygon id="path-1" points="0 0.144728033 12.7505376 0.144728033 12.7505376 10.5376344 0 10.5376344"></polygon>
                        </defs>
                        <g id="官网" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">

                            <g id="icon" transform="translate(30.000000, 60.000000)">
                              <circle id="椭圆形备份-2" fill="#4EB0B3" cx="10" cy="10" r="10"></circle>
                              <g id="编组" transform="translate(3.333333, 4.166667)">
                                <path
                                  d="M5.9193405,7.44318781 C5.9193405,6.73681505 5.3467957,6.16427025 4.64042294,6.16427025 C3.93440143,6.16427025 3.36185663,6.73681505 3.36185663,7.44318781 C3.36185663,8.02556774 3.75139785,8.51732401 4.28389964,8.67152473 C4.28389964,8.67152473 3.41524731,7.60968244 4.14796416,6.94510896 C4.14796416,6.94510896 4.91369892,6.31249964 5.9193405,7.44318781"

                                    <use xlink:href="#path-1"></use>
                                  </mask>

                      </div>
                      <div class="flex flex-col sm:flex-row sm:items-center">

                      </div>
                      <div class="flex flex-col sm:flex-row sm:items-center">

                        </div>
                      </div>
                      <div class="flex justify-center items-center mt-2">
                        <button type="button" class="btn-primary w-40" :class="form.phone || form.email ? '' : 'text-white cursor-not-allowed !bg-[#a7d8d9]'" @click="handleSumbit">发送</button>
                      </div>
                    </form>
                  </div>
                </section>
              </div>
            </div>
            <div class="swiper-pagination swiper-pagination-outer" x-ref="outerPagination"></div>
          </div>
