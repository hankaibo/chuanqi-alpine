<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>资讯中心 - 传麒科技</title>
    <base href="%BASE_URL%" />
    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <div x-data="headerData" x-html="headerHtml"></div>

    <main x-data="data" x-init="getList" class="flex flex-col justify-between">
      <div class="bg-[#f6f7f8] container-primary">
        <div class="-mx-4 sm:-mx-8 lg:-mx-16 xl:-mx-32 2xl:-mx-64">
          <img src="./images/news.webp" class="bg-no-repeat bg-[length:100%_auto]" alt="banner" />
        </div>
        <template x-if="loading">
          <div class="shadow rounded-md p-4 w-full">
            <div class="animate-pulse flex space-x-4">
              <div class="rounded-full bg-slate-700 h-10 w-10"></div>
              <div class="flex-1 space-y-6 py-1">
                <div class="h-2 bg-slate-700 rounded"></div>
                <div class="space-y-3">
                  <div class="grid grid-cols-3 gap-4">
                    <div class="h-2 bg-slate-700 rounded col-span-2"></div>
                    <div class="h-2 bg-slate-700 rounded col-span-1"></div>
                  </div>
                  <div class="h-2 bg-slate-700 rounded"></div>
                </div>
              </div>
            </div>
          </div>
        </template>
        <template x-for="item in newsList" :key="item.id">
          <div class="flex flex-col lg:flex-row mt-4 hover:shadow" @click="handleDetail(item)">
            <div class="h-44 w-full lg:w-60">
              <img class="w-full h-full cursor-pointer object-cover" :src="item.imageUrl" loading="lazy" />
            </div>
            <div class="lg:flex-1 flex flex-col justify-between p-4 h-48 lg:h-44 bg-white">
              <div>
                <h3 class="text-sm md:text-lg text-[#333333] mb-3 cursor-pointer" x-text="item.name"></h3>
                <div class="text-xs md:text-base text-[#888] cursor-pointer text-ellipsis line-clamp-4" x-text="item.summary"></div>
              </div>
              <el-space :size="20">
                <span class="text-[#bbb] text-[10px] inline-flex items-center">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-2 h-2"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-clock"
                  >
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                  </svg>
                  <span class="pl-1">发布时间：</span>
                  <span class="pr-2" x-text="item.publishedAt"></span>

                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-3 h-3"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-eye"
                  >
                    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <span class="pl-1">浏览量：</span>
                  <span x-text="item.views"></span>
                </span>
              </el-space>
            </div>
          </div>
        </template>

        <div class="flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 sm:px-6">
          <div class="flex flex-1 justify-between sm:hidden">
            <a
              href="#"
              class="relative inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
              :class="queryParams.currentPage === 1 ? 'pointer-events-none cursor-not-allowed' :'hover:text-primary focus:z-20 focus:outline-offset-0'"
              @click.prevent="handlePrevious"
              >上一页</a
            >
            <a
              href="#"
              class="relative ml-3 inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
              :class="hasNextPage ? ' hover:text-primary focus:z-20 focus:outline-offset-0': 'pointer-events-none cursor-not-allowed'"
              @click.prevent="handleNext"
              >下一页</a
            >
          </div>
          <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-end">
            <nav class="isolate inline-flex -space-x-px rounded-md shadow-sm" aria-label="Pagination">
              <a
                href="#"
                class="relative inline-flex items-center rounded-l-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300"
                :class="queryParams.currentPage === 1 ? 'pointer-events-none cursor-not-allowed' :'hover:text-primary focus:z-20 focus:outline-offset-0'"
                @click.prevent="handlePrevious"
              >
                <span class="sr-only">上一页</span>
                <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                  <path
                    fill-rule="evenodd"
                    d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z"
                    clip-rule="evenodd"
                  />
                </svg>
              </a>
              <a
                href="#"
                class="relative inline-flex items-center rounded-r-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300"
                :class="hasNextPage ? ' hover:text-primary focus:z-20 focus:outline-offset-0': 'pointer-events-none cursor-not-allowed'"
                @click.prevent="handleNext"
              >
                <span class="sr-only">下一页</span>
                <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                  <path
                    fill-rule="evenodd"
                    d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z"
                    clip-rule="evenodd"
                  />
                </svg>
              </a>
            </nav>
          </div>
        </div>
      </div>
    </main>

    <div x-data="footerData" x-html="footerHtml"></div>

    <script type="module" src="./news.js"></script>
  </body>
</html>
