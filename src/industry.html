<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>行业应用 - 传麒科技</title>
    <base href="%BASE_URL%" />
    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <div x-data="headerData('industries')">
      <!-- #include partials/header.html -->
      <!-- #include partials/header-mobile.html -->
    </div>

    <main x-data="data" class="flex flex-col justify-between">
      <div class="bg-[#f6f7f8] container-primary">
        <div class="-mx-4 sm:-mx-8 lg:-mx-16 xl:-mx-32 2xl:-mx-64">
          <img src="./images/product.webp" class="bg-no-repeat bg-[length:100%_auto]" alt="banner" />
        </div>

        <div class="mt-2 sm:mt-4">
          <div x-data="tabsData" class="relative w-full">
            <div x-ref="tabButtons" class="relative">
              <div class="relative flex items-center text-gray-500 bg-white select-none py-2">
                <template x-for="tab in tabs" :key="tab.id">
                  <button
                    :id="$id(tabId)"
                    @click="tabButtonClicked($el, tab);"
                    type="button"
                    :class="{ 'text-primary' : tabButtonActive($el) }"
                    class="text-lg font-semibold px-12 z-20 inline-flex items-center justify-center h-8 transition-all cursor-pointer whitespace-nowrap"
                    x-text="tab.name"
                  ></button>
                </template>
              </div>
              <div class="relative z-10 w-full h-0.5 bg-white" x-cloak>
                <div x-ref="tabMarker" class="absolute w-40 h-full bg-primary duration-300 ease-out"></div>
              </div>
            </div>

            <div class="relative flex items-center justify-start w-full py-5 mt-2 text-xs text-gray-400 content">
              <template x-for="tab in tabs" :key="tab.id">
                <div :id="$id(tabId + '-content')" x-show="tabContentActive($el)" class="w-full">
                  <template x-for="tabContent in tabContents" :key="tabContent.id">
                    <div class="relative grid grid-cols-1 gap-4 py-4 lg:grid-cols-2 lg:gap-6 lg:pb-6 xl:grid-cols-3 xl:gap-8 xl:pb-8">
                      <template x-for="product in tabContent.productList" :key="product.id">
                        <div @click="handleDetail(product)" class="shadow-lg cursor-pointer hover:-translate-y-5 transition duration-300 group">
                          <div class="w-full h-56">
                            <img class="w-full h-full cursor-pointer object-cover" :src="product.imageUrl" />
                          </div>

                          <div
                            class="flex justify-start items-center h-16 py-2.5 px-5 relative overflow-hidden text-ellipsis line-clamp-2 z-[1] before:absolute before:bottom-0 before:left-0 before:w-0 group-hover:before:w-full before:h-full before:bg-[#4eb0b3] before:transition-all before:duration-300 before:-z-[1]"
                          >
                            <h3 class="group-hover:text-white text-xl text-[#333]" x-text="product.name"></h3>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>
                  <template x-if="tabContents.length===0">
                    <div class="flex justify-center items-center flex-col text-center py-10 h-80 w-full">
                      <svg viewBox="0 0 79 86" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                        <defs>
                          <linearGradient id="linearGradient-1-16" x1="38.8503086%" y1="0%" x2="61.1496914%" y2="100%">
                            <stop stop-color="#FCFCFD" offset="0%"></stop>
                            <stop stop-color="#EEEFF3" offset="100%"></stop>
                          </linearGradient>
                          <linearGradient id="linearGradient-2-16" x1="0%" y1="9.5%" x2="100%" y2="90.5%">
                            <stop stop-color="#FCFCFD" offset="0%"></stop>
                            <stop stop-color="#E9EBEF" offset="100%"></stop>
                          </linearGradient>
                          <rect id="path-3-16" x="0" y="0" width="17" height="36"></rect>
                        </defs>
                        <g id="Illustrations" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                          <g id="B-type" transform="translate(-1268.000000, -535.000000)">
                            <g id="Group-2" transform="translate(1268.000000, 535.000000)">
                              <path
                                id="Oval-Copy-2"
                                d="M39.5,86 C61.3152476,86 79,83.9106622 79,81.3333333 C79,78.7560045 57.3152476,78 35.5,78 C13.6847524,78 0,78.7560045 0,81.3333333 C0,83.9106622 17.6847524,86 39.5,86 Z"
                                fill="#F7F8FC"
                              ></path>
                              <polygon
                                id="Rectangle-Copy-14"
                                fill="#E5E7E9"
                                transform="translate(27.500000, 51.500000) scale(1, -1) translate(-27.500000, -51.500000) "
                                points="13 58 53 58 42 45 2 45"
                              ></polygon>
                              <g id="Group-Copy" transform="translate(34.500000, 31.500000) scale(-1, 1) rotate(-25.000000) translate(-34.500000, -31.500000) translate(7.000000, 10.000000)">
                                <polygon
                                  id="Rectangle-Copy-10"
                                  fill="#E5E7E9"
                                  transform="translate(11.500000, 5.000000) scale(1, -1) translate(-11.500000, -5.000000) "
                                  points="2.84078316e-14 3 18 3 23 7 5 7"
                                ></polygon>
                                <polygon id="Rectangle-Copy-11" fill="#EDEEF2" points="-3.69149156e-15 7 38 7 38 43 -3.69149156e-15 43"></polygon>
                                <rect
                                  id="Rectangle-Copy-12"
                                  fill="url(#linearGradient-1-16)"
                                  transform="translate(46.500000, 25.000000) scale(-1, 1) translate(-46.500000, -25.000000) "
                                  x="38"
                                  y="7"
                                  width="17"
                                  height="36"
                                ></rect>
                                <polygon
                                  id="Rectangle-Copy-13"
                                  fill="#F8F9FB"
                                  transform="translate(39.500000, 3.500000) scale(-1, 1) translate(-39.500000, -3.500000) "
                                  points="24 7 41 7 55 -3.63806207e-12 38 -3.63806207e-12"
                                ></polygon>
                              </g>
                              <rect id="Rectangle-Copy-15" fill="url(#linearGradient-2-16)" x="13" y="45" width="40" height="36"></rect>
                              <g id="Rectangle-Copy-17" transform="translate(53.000000, 45.000000)">
                                <mask id="mask-4-16" fill="white">
                                  <use xlink:href="#path-3-16"></use>
                                </mask>
                                <use id="Mask" fill="#E0E3E9" transform="translate(8.500000, 18.000000) scale(-1, 1) translate(-8.500000, -18.000000) " xlink:href="#path-3-16"></use>
                                <polygon
                                  id="Rectangle-Copy"
                                  fill="#D5D7DE"
                                  mask="url(#mask-4-16)"
                                  transform="translate(12.000000, 9.000000) scale(-1, 1) translate(-12.000000, -9.000000) "
                                  points="7 0 24 0 20 18 -1.70530257e-13 16"
                                ></polygon>
                              </g>
                              <polygon
                                id="Rectangle-Copy-18"
                                fill="#F8F9FB"
                                transform="translate(66.000000, 51.500000) scale(-1, 1) translate(-66.000000, -51.500000) "
                                points="62 45 79 45 70 58 53 58"
                              ></polygon>
                            </g>
                          </g>
                        </g>
                      </svg>
                      <div>暂无数据</div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div x-data="footerData">
      <!-- #include partials/footer.html -->
      <!-- #include partials/footer-mobile.html -->
    </div>

    <script type="module" src="./industry.js"></script>
  </body>
</html>
